<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Parceiro - Não Vou Sozinho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center p-4">

    <!-- Tela de Acesso -->
    <div id="login-box" class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl mt-16 border border-slate-100">
        <div class="flex justify-center mb-6">
            <!-- Insira o logo aqui se desejar -->
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
            </div>
        </div>
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-2">Painel do Parceiro</h2>
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-2">NaoVouSozinho.com</h2>
        <p class="text-center text-sm text-slate-500 mb-6">Acompanhe suas indicações e comissões do app "Não Vou Sozinho" em tempo real.</p>
        
        <div class="space-y-4">
            <input type="text" id="codigo" placeholder="Seu Código (ex: MARIA2026)" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-center uppercase font-bold tracking-wider focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            <input type="password" id="senha" placeholder="Sua Senha" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-center focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            
            <button id="btn-acessar" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">
                Acessar Resultados
            </button>
            <div id="msg-erro" class="hidden text-red-500 text-sm font-semibold text-center mt-2"></div>
        </div>
    </div>

    <!-- Dashboard de Resultados -->
    <div id="dashboard" class="hidden w-full max-w-xl mt-8">
        <button id="btn-voltar" class="mb-6 flex items-center gap-2 text-slate-500 hover:text-slate-800 font-semibold transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Voltar
        </button>
        
        <div class="flex justify-between items-end mb-6">
            <div>
                <h3 id="nome-campanha" class="text-2xl font-bold text-slate-800">Olá, Parceiro</h3>
                <div id="status-campanha" class="mt-2"></div>
                <button id="btn-copiar-link" class="mt-3 text-sm text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1 transition-colors outline-none cursor-pointer">
                    🔗 Copiar meu link de indicação
                </button>
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-6 mb-6 shadow-sm">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                <div>
                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Comissão Estimada</p>
                    <h1 id="valor-ganho" class="text-4xl font-black text-green-500 mt-1">R$ 0,00</h1>
                </div>
                <div class="text-center sm:text-right">
                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Contas Ativadas</p>
                    <h2 id="qtd-leads" class="text-3xl font-bold text-blue-600 mt-1">0</h2>
                </div>
            </div>
            
            <div class="bg-slate-50 rounded-xl p-4 border border-slate-100 text-sm">
                <div class="flex justify-between mb-2"><span class="text-slate-500">Taxa Fixa (Setup):</span> <strong id="info-fixo" class="text-slate-700">R$ 0,00</strong></div>
                <div class="flex justify-between mb-2"><span class="text-slate-500">Valor por Cadastro:</span> <strong id="info-lead" class="text-slate-700">R$ 0,00</strong></div>
                <div class="flex justify-between"><span class="text-slate-500">Prazo da Campanha:</span> <strong id="info-dias" class="text-slate-700">0 dias</strong></div>
            </div>
        </div>

        <h4 class="text-lg font-bold text-slate-800 mb-4">Últimos Cadastros</h4>
        <div id="lista-leads" class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm flex flex-col">
            <!-- Injetado via JS -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Cole aqui as MESMAS configurações do seu Firebase (do arquivo index.html)
        const firebaseConfig = {
            apiKey: "AIzaSyD1IYYMSYXBqfgvUQrp8DaX4Z5n7-4Wryw",
            authDomain: "viagensappoficial.firebaseapp.com",
            databaseURL: "https://viagensappoficial-default-rtdb.firebaseio.com",
            projectId: "viagensappoficial",
            storageBucket: "viagensappoficial.firebasestorage.app",
            messagingSenderId: "344833861467",
            appId: "1:344833861467:web:4fcd794a653fefcb68dc7e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- FUNÇÃO PARA COPIAR O PRÓPRIO LINK ---
        window.copyMyLink = (codigo, btnElement) => {
            // Nota: Mude '/app.html' para '/' ou '/index.html' dependendo de qual é a página de cadastro do seu projeto atual!
            const link = `${window.location.origin}/app.html?ref=${codigo}`;
            
            navigator.clipboard.writeText(link).then(() => {
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = '✅ Link Copiado!';
                btnElement.classList.replace('text-blue-600', 'text-green-600');
                
                setTimeout(() => {
                    btnElement.innerHTML = originalText;
                    btnElement.classList.replace('text-green-600', 'text-blue-600');
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar o link:', err);
                alert('Falha ao copiar o link. Verifique as permissões do navegador.');
            });
        };

        document.getElementById('btn-acessar').addEventListener('click', async () => {
            const codigo = document.getElementById('codigo').value.trim().toUpperCase();
            const senhaDigitada = document.getElementById('senha').value.trim();
            const erro = document.getElementById('msg-erro');
            const btn = document.getElementById('btn-acessar');
            
            if (!codigo || !senhaDigitada) { 
                erro.innerText = "Digite código e senha.";
                erro.classList.remove('hidden'); return;
            }

            erro.classList.add('hidden');
            btn.innerText = "Buscando...";

            try {
                const campSnap = await get(ref(db, `parcerias/${codigo}`));
                if (!campSnap.exists()) {
                    erro.innerText = "Código inválido.";
                    erro.classList.remove('hidden');
                    btn.innerText = "Acessar Resultados"; return;
                }

                const campanha = campSnap.val();

                if (campanha.senha && campanha.senha !== senhaDigitada) {
                    erro.innerText = "Senha incorreta.";
                    erro.classList.remove('hidden');
                    btn.innerText = "Acessar Resultados"; return;
                }

                const leads = campanha.leads ? Object.values(campanha.leads) : [];

                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                document.getElementById('nome-campanha').innerText = "Olá, " + (campanha.nome || "Parceiro");
                
                let statusHtml = `<span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Aguardando 1º registro</span>`;
                
                if (leads.length > 0) {
                    leads.sort((a, b) => new Date(a.dataCadastro) - new Date(b.dataCadastro));
                    const dataInicio = new Date(leads[0].dataCadastro);
                    const dataFim = new Date(dataInicio);
                    dataFim.setDate(dataFim.getDate() + (Number(campanha.diasValidade) || 30));
                    
                    const isAtivo = new Date() <= dataFim && campanha.status !== 'finalizada';
                    
                    if (campanha.status === 'finalizada') {
                        statusHtml = `<span class="bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Arquivada</span>`;
                    } else if (isAtivo) {
                        statusHtml = `<span class="bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Ativa até ${dataFim.toLocaleDateString('pt-BR')}</span>`;
                    } else {
                        statusHtml = `<span class="bg-red-100 text-red-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Prazo Encerrado</span>`;
                    }
                }
                document.getElementById('status-campanha').innerHTML = statusHtml;

                // Configura o botão de copiar link com o código do parceiro logado
                const btnCopiar = document.getElementById('btn-copiar-link');
                if (btnCopiar) {
                    btnCopiar.onclick = function() {
                        window.copyMyLink(codigo, this);
                    };
                }

                const base = Number(campanha.valorBase) || 0;
                const leadValue = Number(campanha.valorPorLead) || 0;
                const qtd = leads.length;
                const totalGanho = base + (qtd * leadValue);

                document.getElementById('qtd-leads').innerText = qtd;
                document.getElementById('valor-ganho').innerText = "R$ " + totalGanho.toLocaleString('pt-BR', {minimumFractionDigits: 2});
                document.getElementById('info-fixo').innerText = "R$ " + base.toLocaleString('pt-BR', {minimumFractionDigits: 2});
                document.getElementById('info-lead').innerText = "R$ " + leadValue.toLocaleString('pt-BR', {minimumFractionDigits: 2});
                document.getElementById('info-dias').innerText = (campanha.diasValidade || 30) + " dias (após o 1º cadastro)";

                const listContainer = document.getElementById('lista-leads');
                if (leads.length === 0) {
                    listContainer.innerHTML = `<div class="p-6 text-center text-slate-500 font-medium bg-slate-50">Nenhum cadastro vinculado ainda.</div>`;
                } else {
                    listContainer.innerHTML = leads.sort((a, b) => new Date(b.dataCadastro) - new Date(a.dataCadastro))
                        .map(l => {
                            const data = new Date(l.dataCadastro).toLocaleDateString('pt-BR');
                            const nomeSeguro = l.nome ? l.nome.split(' ')[0] + ' ***' : 'Usuário';
                            return `<div class="flex justify-between items-center p-4 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors"><strong class="text-slate-700">${nomeSeguro}</strong><span class="text-sm text-slate-400 font-medium">${data}</span></div>`;
                        }).join('');
                }
            } catch (e) {
                console.error(e);
                erro.innerText = "Erro ao carregar dados.";
                erro.classList.remove('hidden');
            }
            btn.innerText = "Acessar Resultados";
        });

        document.getElementById('btn-voltar').addEventListener('click', () => {
            document.getElementById('codigo').value = '';
            document.getElementById('senha').value = '';
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        });
    </script>
</body>
</html>
